<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title></title>
    <link rel="stylesheet" href="css/popup.css">
</head>
<body class="lbc-saved-searches">

<header>
    <img src="img/icon_default-48.png">
    <h1>Mes Recherches Sauvegardées<br><span>Leboncoin</span></h1>
</header>

<div class="lbc-saved-searches__content">

    <div class="lbc-saved-searches__maj-container">
        <p>Pour mettre à jour la liste de vos recherches sauvegardées :</p>
        <ol>
            <li>Accédez à la page de vos recherches sur Leboncoin (vous devez être connecté) : <a href="https://www.leboncoin.fr/my-searches" target="_newtab">leboncoin.fr/my-searches</a></li>
            <li>Rouvrez l'extension et cliquez sur le bouton ci-dessous :</li>
        </ol>
        <button class="lbc-saved-searches__maj">&#x21bb; Récupérer les recherches</button>
        <span class="lbc-saved-searches__last-update"></span>
    </div>

    <div id="saved-searches">
        <div class="loader"></div>
    </div>

</div>

<div class="lbc-saved-searches__rate-container">
    <button id="lbc-saved-searches__rate-button">&#9733; Noter cette extension</button>
</div>

<footer>
    Par <a href="https://shevabam.fr" target="_blank">shevabam</a><span class="lbc-saved-searches__bullet">•</span><a href="https://github.com/shevabam/extension-leboncoin-recherches-sauvegardees" target="_blank">Plus d'infos</a>
</footer>

<div id="lbc-saved-searches__response"></div>

<script src="js/functions.js"></script>
<script src="js/popup.js"></script>

</body>
</html>
